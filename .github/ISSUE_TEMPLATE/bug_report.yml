name: "🐛 Bug report / 缺陷反馈"
description: Report a reproducible problem / 报告可复现的问题
title: "[Bug]: "
labels:
  - "🐛 Bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Usage questions and integration help belong in [GitHub Discussions](https://github.com/my-mcp-hub/mcp-kit/discussions).

        感谢反馈缺陷。使用问题和集成帮助请前往 [GitHub Discussions](https://github.com/my-mcp-hub/mcp-kit/discussions)。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites / 提交前检查
      options:
        - label: I searched existing issues and discussions for the same problem. / 我已搜索现有 Issue 和 Discussions。
          required: true
        - label: I can reproduce the problem in a public minimal example without private data. / 我可以在不含私密数据的公开最小示例中复现问题。
          required: true

  - type: input
    id: package-version
    attributes:
      label: create-mcp-kit version / 版本
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: dropdown
    id: project-type
    attributes:
      label: Project type / 项目类型
      options:
        - MCP Server / MCP 服务端
        - MCP Client / MCP 客户端
        - Other / 其他
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime and version / 运行时及版本
      placeholder: e.g. Node.js 22, Bun 1.3, Deno 2.6
    validations:
      required: true

  - type: input
    id: package-manager
    attributes:
      label: Package manager and version / 包管理器及版本
      placeholder: e.g. pnpm 10.34, npm 11, Yarn 4
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version / 操作系统及版本
      placeholder: e.g. macOS 26, Windows 11, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command used / 执行的命令
      placeholder: e.g. pnpm create mcp-kit
    validations:
      required: true

  - type: input
    id: minimal-reproduction
    attributes:
      label: Minimal reproduction URL / 最小复现地址
      description: Link a small public GitHub repository or similar demo. / 请提供精简的公开仓库或类似演示。
      placeholder: https://github.com/...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Run the command
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior / 实际行为
      description: Include complete errors or console output when relevant. / 如有错误或控制台输出，请完整粘贴。
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context / 其他信息
      description: Add screenshots, recordings, generated configuration, or other details that may help diagnose the problem. / 可补充截图、录屏、生成的配置或其他有助于诊断的信息。
